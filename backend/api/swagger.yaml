openapi: "3.0.3"
info:
  title: 算力撮合交易平台 API
  description: |
    ## 概述
    算力现货挂牌撮合交易平台 v1 API。包含账户认证、算力撮合、支付分账、居间金融、运营管理、区块链存证六大模块。

    **Base URL**: `http://localhost:8080/api/v1`

    ## 鉴权
    除公开接口外，所有接口需 `Authorization: Bearer <jwt_token>`

    ## 金额单位
    所有金额单位为**分（fen）**，即 `100 = ¥1.00`

    ## 通用响应格式
    ```json
    { "code": 0, "message": "success", "data": {}, "request_id": "xxx" }
    ```
  version: "1.0.0"
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境

tags:
  - name: 认证 Auth
  - name: 用户 User
  - name: 算力撮合 Compute
  - name: 开发 Dev
  - name: 支付分账 Payment
  - name: 居间金融 Intermediary
  - name: 运营管理 Admin
  - name: 区块链存证 Blockchain

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Response:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: "success" }
        data: { type: object }
        request_id: { type: string }

    PageData:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    Product:
      type: object
      properties:
        id: { type: integer }
        supplier_id: { type: integer }
        gpu_model: { type: string, example: "NVIDIA H100 SXM 80GB" }
        card_count: { type: integer, example: 8 }
        cpu_spec: { type: string }
        memory_spec: { type: string }
        storage_spec: { type: string }
        bandwidth_spec: { type: string }
        delivery_mode: { type: string, enum: [bare_metal, container, vm, rack] }
        pricing_mode: { type: string, enum: [hourly, weekly, monthly] }
        unit_price: { type: integer, description: "单价(分)/卡·时", example: 3500 }
        available_hours: { type: string, example: "全天 24h" }
        stock: { type: integer }
        min_order: { type: integer }
        min_duration: { type: integer }
        region: { type: string, example: "北京" }
        status: { type: string }
        self_operated: { type: boolean }

    CreditScore:
      type: object
      properties:
        supplier_id: { type: integer }
        fulfill_rate: { type: number, example: 99.2 }
        sla_rate: { type: number, example: 99.8 }
        violation_count: { type: integer }
        total_orders: { type: integer }

    Order:
      type: object
      properties:
        id: { type: integer }
        order_no: { type: string, example: "ORD20260713143000123abc" }
        buyer_id: { type: integer }
        product_id: { type: integer }
        quantity: { type: integer }
        duration: { type: integer, description: "租期(小时)" }
        unit_price: { type: integer, description: "单价(分)" }
        total_amount: { type: integer, description: "总金额(分)" }
        platform_fee: { type: integer, description: "平台佣金(分)" }
        status: { type: string, enum: [pending_payment, paid, provisioning, active, completed, cancelled, refunding, refunded, frozen] }
        payment_expires_at: { type: string, format: date-time }
        lease_start_at: { type: string, format: date-time }
        lease_end_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    BuyerOrder:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          properties:
            gpu_model: { type: string, description: "商品 GPU 型号；不适用时为空串" }
            product_type: { type: string, enum: [card_rental, outright, center, colocation] }
            pricing_mode: { type: string, enum: [hourly, daily, weekly, monthly, perpetual] }
            self_operated: { type: boolean }
            supplier_name: { type: string, description: "自营商品为平台自营；非自营取已认证企业名称，无资料时为空串" }

    BuyerOrderPage:
      type: object
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/BuyerOrder' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    BuyerOrderDetail:
      type: object
      required: [order, product, supplier, delivery, actions]
      properties:
        order:
          type: object
          properties:
            order_no: { type: string, example: "ORD20260713143000123abc" }
            status: { type: string, enum: [pending_payment, paid, provisioning, active, completed, cancelled, refunding, refunded, frozen] }
            quantity: { type: integer }
            duration: { type: integer, description: "计费周期数，单位由 product.pricing_mode 决定" }
            unit_price: { type: integer, description: "单价（分）" }
            total_amount: { type: integer, description: "总金额（分）" }
            platform_fee: { type: integer, description: "平台佣金（分）" }
            payment_expires_at: { type: string, format: date-time, nullable: true }
            lease_start_at: { type: string, format: date-time, nullable: true }
            lease_end_at: { type: string, format: date-time, nullable: true }
            compliance_agreed: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        product:
          type: object
          description: "当前关联商品资料；现有数据模型没有不可变的下单快照"
          properties:
            id: { type: integer }
            product_type: { type: string, enum: [card_rental, outright, center, colocation] }
            gpu_model: { type: string }
            card_count: { type: integer }
            machine_count: { type: integer, nullable: true }
            total_pflops_approx: { type: string, nullable: true }
            power_capacity_kw: { type: integer, nullable: true }
            rack_count: { type: integer, nullable: true }
            cpu_spec: { type: string }
            memory_spec: { type: string }
            storage_spec: { type: string }
            bandwidth_spec: { type: string }
            delivery_mode: { type: string }
            pricing_mode: { type: string, enum: [hourly, daily, weekly, monthly, perpetual] }
            region: { type: string }
            self_operated: { type: boolean }
        supplier:
          type: object
          properties:
            name: { type: string }
            self_operated: { type: boolean }
            credit:
              type: object
              nullable: true
              properties:
                fulfill_rate: { type: number }
                sla_rate: { type: number }
                violation_count: { type: integer }
                total_orders: { type: integer }
                updated_at: { type: string, format: date-time }
        delivery:
          type: object
          nullable: true
          description: "仅返回状态摘要；访问凭证继续使用独立接口"
          properties:
            access_status: { type: string, enum: [none, generated, delivered, revoked] }
            access_expires_at: { type: string, format: date-time, nullable: true }
            revoked_at: { type: string, format: date-time, nullable: true }
            confirmed_by_buyer: { type: boolean }
            buyer_confirmed_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
        actions:
          type: object
          properties:
            can_confirm: { type: boolean }
            can_renew: { type: boolean }
            can_refund: { type: boolean }
            can_view_credential: { type: boolean }

    Delivery:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        confirmed_by_buyer: { type: boolean }
        buyer_confirmed_at: { type: string, format: date-time }

    KYCStatus:
      type: object
      properties:
        personal: { $ref: '#/components/schemas/KYCItem' }
        enterprise: { $ref: '#/components/schemas/KYCItem' }

    KYCItem:
      type: object
      properties:
        status: { type: string, enum: [none, pending, verified, rejected] }
        real_name: { type: string }
        name: { type: string }

    Lead:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [equipment, construction, finance_lease] }
        contact_name: { type: string }
        contact_phone: { type: string }
        description: { type: string }
        status: { type: string, enum: [new, assigned, following, quoted, closed, cancelled] }
        assignee_id: { type: integer }

    Alert:
      type: object
      properties:
        id: { type: integer }
        level: { type: string, enum: [high, medium, low] }
        alert_type: { type: string }
        target_type: { type: string }
        target_id: { type: integer }
        status: { type: string }
        created_at: { type: string, format: date-time }

    VerifyResult:
      type: object
      properties:
        verified: { type: boolean }
        tx_id: { type: string }
        chain_timestamp: { type: string }
        verify_url: { type: string }

security:
  - BearerAuth: []

paths:
  # ==================== 认证 ====================
  /auth/captcha/verify:
    post:
      tags: [认证 Auth]
      summary: 校验一次性人机验证 token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captcha_token]
              properties:
                captcha_token: { type: string }
      responses:
        '200':
          description: "请求已处理；token 仅可成功使用一次"

  /auth/sms/code:
    post:
      tags: [认证 Auth]
      summary: 发送登录或注册验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose, captcha_token]
              properties:
                phone: { type: string, example: "13800138000" }
                purpose: { type: string, enum: [register, login], example: "login" }
                captcha_token: { type: string }
      responses:
        '200':
          description: "请求已处理；注册手机号已存在时返回业务码 40900 且不发送验证码；否则验证码有效期默认 300 秒，60 秒后可重新获取"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      expires_in: { type: integer, example: 300 }
                      resend_after: { type: integer, example: 60 }
                      preview_code:
                        type: string
                        pattern: '^[0-9]{6}$'
                        description: "仅本地 debug preview 模式返回；release 模式禁止启用"

  /auth/sms/login:
    post:
      tags: [认证 Auth]
      summary: 已注册用户短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, sms_code]
              properties:
                phone: { type: string, example: "13800138000" }
                sms_code: { type: string, pattern: '^[0-9]{6}$', example: "123456" }
      responses:
        '200':
          description: "登录成功，返回 access_token、refresh_token 与用户信息"

  /auth/register:
    post:
      tags: [认证 Auth]
      summary: 手机号验证码注册并建立会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, sms_code, agree_tos]
              properties:
                phone: { type: string, example: "13800138000" }
                sms_code: { type: string, example: "123456" }
                agree_tos: { type: boolean, example: true }
      responses:
        '200':
          description: "注册成功，返回 access_token、refresh_token 与默认 buyer 用户信息"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token: { type: string }
                          refresh_token: { type: string }
                          expires_in: { type: integer, example: 900 }
                          user: { type: object }

  /auth/refresh:
    post:
      tags: [认证 Auth]
      summary: 刷新 Token（refresh token 一次性轮换）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }

  /auth/logout:
    post:
      tags: [认证 Auth]
      summary: 登出
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: "传入时与 access token 一并撤销" }

  /auth/me:
    get:
      tags: [认证 Auth]
      summary: 当前用户信息
      responses:
        '200':
          description: "用户信息"

  # ==================== 用户 ====================
  /user/kyc/personal:
    post:
      tags: [用户 User]
      summary: 个人实名认证
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [real_name, id_card]
              properties:
                real_name: { type: string, example: "张三" }
                id_card: { type: string, example: "110101199001011234" }

  /user/kyc/enterprise:
    post:
      tags: [用户 User]
      summary: 企业认证
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enterprise_name, uscc, license_url, legal_person]
              properties:
                enterprise_name: { type: string, example: "某科技有限公司" }
                uscc: { type: string }
                license_url: { type: string }
                legal_person: { type: string }

  /user/kyc/status:
    get:
      tags: [用户 User]
      summary: KYC 认证状态
      responses:
        '200': { description: "OK", content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Response' }, { type: object, properties: { data: { $ref: '#/components/schemas/KYCStatus' } } }] } } } }

  /user/roles:
    post:
      tags: [用户 User]
      summary: 申请角色
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [supplier, vendor, funder] }

  /user/profile:
    get:
      tags: [用户 User]
      summary: 个人信息
    put:
      tags: [用户 User]
      summary: 更新个人信息

  # ==================== 算力撮合 ====================
  /products:
    get:
      tags: [算力撮合 Compute]
      summary: 算力商品列表
      security: []
      parameters:
        - { name: gpu_model, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: pricing_mode, in: query, schema: { type: string, enum: [hourly, weekly, monthly] } }
        - { name: price_min, in: query, schema: { type: integer } }
        - { name: price_max, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [price_asc, price_desc, created_at_desc] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: "商品列表" }
    post:
      tags: [算力撮合 Compute]
      summary: 上架算力商品（供给方）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [gpu_model, card_count, delivery_mode, pricing_mode, unit_price, stock, region, compliance_agreed]
              properties:
                gpu_model: { type: string }
                card_count: { type: integer }
                cpu_spec: { type: string }
                memory_spec: { type: string }
                storage_spec: { type: string }
                bandwidth_spec: { type: string }
                delivery_mode: { type: string }
                pricing_mode: { type: string }
                unit_price: { type: integer, description: "单价(分)/卡·时" }
                available_hours: { type: string }
                stock: { type: integer }
                min_order: { type: integer }
                min_duration: { type: integer }
                region: { type: string }
                compliance_agreed: { type: boolean }

  /products/{id}:
    get:
      tags: [算力撮合 Compute]
      summary: 商品详情（含信用分）
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "OK" }

  /orders:
    post:
      tags: [算力撮合 Compute]
      summary: 下单
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, duration, compliance_agreed]
              properties:
                product_id: { type: integer }
                quantity: { type: integer }
                duration: { type: integer, description: "租期(小时)" }
                compliance_agreed: { type: boolean }
      responses:
        '200': { description: "订单创建成功" }
    get:
      tags: [算力撮合 Compute]
      summary: 我的订单（买家）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_payment, paid, provisioning, active, completed, cancelled, refunding, refunded, frozen] } }
        - { name: order_no, in: query, schema: { type: string }, description: "订单号包含搜索，可带开头的 #" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000 }, description: "默认 1" }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: "默认 20，最大 100" }
      responses:
        '200':
          description: "业务结果；仍需检查响应 code 是否为 0"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Response' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BuyerOrderPage' }

  /orders/{order_no}:
    get:
      tags: [算力撮合 Compute]
      summary: 买家订单详情
      description: "仅返回当前 JWT 用户自己的订单；不存在或非本人均为 code=40400。商品/供给方是当前关联资料，不是下单快照。"
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string, pattern: '^(ORD|REN)[A-Za-z0-9-]{6,29}$', maxLength: 32 }, description: "订单号，不接受自增 ID" }
      responses:
        '200':
          description: "业务结果；仍需检查响应 code 是否为 0"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Response' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BuyerOrderDetail' }

  /dev/fixtures/buyer-orders:
    post:
      tags: [开发 Dev]
      summary: 为当前登录用户生成买家订单夹具
      description: "仅在 server.mode != release 时注册；无请求体，幂等写入 4 条开发订单。生产环境没有此路由。"
      responses:
        '200': { description: "成功 code=0，data 包含 orders 与 count" }

  /orders/{id}/deliver:
    post:
      tags: [算力撮合 Compute]
      summary: 回填交付凭证（供给方）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ip_address: { type: string }
                ssh_port: { type: integer }
                username: { type: string }
                credential_note: { type: string }

  /orders/{id}/confirm:
    post:
      tags: [算力撮合 Compute]
      summary: 确认签收（买家）
      description: "仅订单本人可确认 provisioning 且已生成访问凭证的订单。请传订单号，不传请求体。"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "订单号 order_no" }
      responses:
        '200': { description: "成功 code=0；不可签收/重复签收 code=40900；非本人 code=40300" }

  /orders/{id}/renew:
    post:
      tags: [算力撮合 Compute]
      summary: 续费
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { type: integer }

  /orders/{id}/refund:
    post:
      tags: [算力撮合 Compute]
      summary: 申请退款

  /supplier/qualifications:
    get:
      tags: [算力撮合 Compute]
      summary: 我的资质
    post:
      tags: [算力撮合 Compute]
      summary: 提交资质

  /supplier/products:
    get:
      tags: [算力撮合 Compute]
      summary: 我的商品

  /supplier/orders:
    get:
      tags: [算力撮合 Compute]
      summary: 供给方订单

  # ==================== 支付 ====================
  /payment/pay:
    post:
      tags: [支付分账 Payment]
      summary: 发起支付
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no, channel]
              properties:
                order_no: { type: string }
                channel: { type: string, enum: [wechat, alipay, bank] }

  /payment/status/{order_no}:
    get:
      tags: [支付分账 Payment]
      summary: 支付状态查询
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }

  /payment/callback:
    post:
      tags: [支付分账 Payment]
      summary: 易宝支付回调
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_id: { type: string }
                order_no: { type: string }
                status: { type: string }
                amount: { type: integer }

  /payment/supplier/onboard:
    post:
      tags: [支付分账 Payment]
      summary: 供给方易宝进件

  /payment/supplier/onboard/status:
    get:
      tags: [支付分账 Payment]
      summary: 进件状态

  /payment/settlements:
    get:
      tags: [支付分账 Payment]
      summary: 分账记录

  # ==================== 居间 ====================
  /leads:
    post:
      tags: [居间金融 Intermediary]
      summary: 创建线索
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [equipment, construction] }
                contact_name: { type: string }
                contact_phone: { type: string }
                contact_email: { type: string }
                description: { type: string }
                amount_range: { type: string }
                term: { type: string }

  /finance/lease/contact:
    post:
      tags: [居间金融 Intermediary]
      summary: 融资租赁留资
      security: []

  /commissions:
    get:
      tags: [居间金融 Intermediary]
      summary: 佣金台账

  /vendor/leads:
    get:
      tags: [居间金融 Intermediary]
      summary: 厂商线索

  /leads/{id}/quote:
    post:
      tags: [居间金融 Intermediary]
      summary: 报价

  /leads/{id}/close:
    post:
      tags: [居间金融 Intermediary]
      summary: 成交登记
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deal_amount, commission_rate]
              properties:
                deal_amount: { type: integer, description: "成交金额(分)" }
                commission_rate: { type: number, description: "佣金率(%)" }

