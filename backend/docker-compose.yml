services:
  app:
    build: .
    env_file:
      - path: .env.sms.local
        required: false
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tokenfactory
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./migrations/002_compute_market_expansion.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./migrations/003_equipment_and_collateral.up.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./migrations/004_fix_user_role_enum.up.sql:/docker-entrypoint-initdb.d/004.sql:ro
      - ./migrations/005_clarify_order_duration_semantics.up.sql:/docker-entrypoint-initdb.d/005.sql:ro
      - ./migrations/006_remove_default_admin_seed.up.sql:/docker-entrypoint-initdb.d/006.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
