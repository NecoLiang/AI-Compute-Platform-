services:
  app:
    build: .
    env_file:
      - path: .env.sms.local
        required: false
      - path: .env.wechat.local
        required: false
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tokenfactory
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./migrations/002_compute_market_expansion.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./migrations/003_equipment_and_collateral.up.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./migrations/004_fix_user_role_enum.up.sql:/docker-entrypoint-initdb.d/004.sql:ro
      - ./migrations/005_clarify_order_duration_semantics.up.sql:/docker-entrypoint-initdb.d/005.sql:ro
      - ./migrations/006_remove_default_admin_seed.up.sql:/docker-entrypoint-initdb.d/006.sql:ro
      - ./migrations/007_blockchain_worker_bookkeeping.up.sql:/docker-entrypoint-initdb.d/007.sql:ro
      - ./migrations/008_invoice_management.up.sql:/docker-entrypoint-initdb.d/008.sql:ro
      - ./migrations/008_supplier_nodes_and_health.up.sql:/docker-entrypoint-initdb.d/008_supplier_nodes.sql:ro
      - ./migrations/009_ticket_support.up.sql:/docker-entrypoint-initdb.d/009.sql:ro
      - ./migrations/009_gpu_catalog.up.sql:/docker-entrypoint-initdb.d/009_gpu_catalog.sql:ro
      - ./migrations/010_notifications.up.sql:/docker-entrypoint-initdb.d/010.sql:ro
      - ./migrations/011_supplier_onboarding.up.sql:/docker-entrypoint-initdb.d/011.sql:ro
      - ./migrations/012_persist_enterprise_kyc_application.up.sql:/docker-entrypoint-initdb.d/012.sql:ro
      - ./migrations/013_supplier_application_document.up.sql:/docker-entrypoint-initdb.d/013.sql:ro
      - ./migrations/014_persist_admin_controls.up.sql:/docker-entrypoint-initdb.d/014.sql:ro
      - ./migrations/015_product_review_reason.up.sql:/docker-entrypoint-initdb.d/015.sql:ro
      - ./migrations/016_compute_inquiry_leads.up.sql:/docker-entrypoint-initdb.d/016.sql:ro
      - ./migrations/017_payment_checkout_url.up.sql:/docker-entrypoint-initdb.d/017.sql:ro
      - ./migrations/018_wechat_login.up.sql:/docker-entrypoint-initdb.d/018.sql:ro
      - ./migrations/019_legal_consents.up.sql:/docker-entrypoint-initdb.d/019.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
