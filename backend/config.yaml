server:
  port: "8080"
  mode: debug

database:
  dsn: "root:password@tcp(127.0.0.1:3306)/tokenfactory?parseTime=true&charset=utf8mb4"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  access_secret: "change-me-access-secret-key-32chars"
  refresh_secret: "change-me-refresh-secret-key-32chars"
  access_ttl: 900
  refresh_ttl: 604800

security:
  # 交付访问凭证 AES-256-GCM 加密密钥: 64 位 hex = 32 字节。
  # 留空表示未接入: 此时生成访问凭证的接口会返回明确错误, 不会降级存明文。
  # 生成方式: openssl rand -hex 32
  # 生产环境请从 KMS / 环境变量注入, 不要把真实密钥提交进仓库。
  credential_key: ""
