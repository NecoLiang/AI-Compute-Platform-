server:
  port: "8080"
  mode: debug

database:
  # loc 必须显式指定且与 MySQL 会话时区一致(本项目为 +08:00)。
  # 缺省时 go-sql-driver 按 UTC 写入 time.Time, 而 MySQL 按 +08:00 解读,
  # 会造成 8 小时偏移 —— 写入的"10 分钟后过期"会变成"8 小时前已过期",
  # 导致订单一创建就被关单任务取消、访问凭证一签发就被吊销。
  dsn: "root:password@tcp(127.0.0.1:3306)/tokenfactory?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  access_secret: "change-me-access-secret-key-32chars"
  refresh_secret: "change-me-refresh-secret-key-32chars"
  access_ttl: 900
  refresh_ttl: 604800

sms:
  enabled: false
  sign_name: ""
  login_template_code: ""
  register_template_code: ""
  endpoint: "dysmsapi.aliyuncs.com"
  code_ttl: 300

security:
  # 交付访问凭证 AES-256-GCM 加密密钥: 64 位 hex = 32 字节。
  # 留空表示未接入: 此时生成访问凭证的接口会返回明确错误, 不会降级存明文。
  # 生成方式: openssl rand -hex 32
  # 生产环境请从 KMS / 环境变量注入, 不要把真实密钥提交进仓库。
  credential_key: ""
  cap_siteverify_url: ""
  cap_secret: ""

ai:
  # 智能搜索的模型网关(OpenAI 兼容 /chat/completions)。三项要么全空(未接入:
  # 智能搜索接口返回明确错误), 要么全配。生产从环境变量 AI_BASE_URL/AI_API_KEY/AI_MODEL 注入。
  base_url: ""
  api_key: ""
  model: ""
  timeout_seconds: 30

blockchain:
  # BSN 开放联盟链·文昌链存证 (docs/14)。存证走链原生 irismod.record 模块, 无需合约。
  # gateway_url/project_id 来自 BSN 门户「项目管理 → 下载接入参数」。
  # 三项(gateway_url/project_id/account_key)要么全空(未接入: 存证事件落库为
  # pending, 配置后自动补推), 要么全配。
  gateway_url: ""   # 如 https://opbningxia.bsngate.com:18602
  project_id: ""
  project_key: ""   # 项目未启用密钥校验时留空
  chain_id: "wenchangchain"
  # 链账户 secp256k1 私钥, 64 位 hex — 敏感! 生产从环境变量 BLOCKCHAIN_ACCOUNT_KEY 注入。
  # 该账户地址(iaa1...)需在 BSN 门户「链账户」绑定并分配能量值(gas)。
  account_key: ""
  denom: "ugas"
  gas_limit: 200000
  gas_price: 1      # 接入参数表 gasprice
  # 区块链浏览器 tx 查询前缀, 供前端"链上自行查验"链接。
  explorer_url: ""
  # 平台见证签名 Ed25519 种子, 64 位 hex (openssl rand -hex 32)。
  # 生产从 KMS/环境变量注入; 留空表示暂不签名, 存证仍可用。
  sign_key_seed: ""
