name: wanxiang-backend

services:
  backend:
    image: wanxiang-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: wanxiang-backend
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
        required: true
    environment:
      SERVER_PORT: "8080"
      SERVER_MODE: release
      REDIS_ADDR: wanxiang-redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - middleware
      - frontend
      - accessgw
    # fleet.selftest_key_file 指向 /etc/omnis/selftest_ed25519(由 deploy/accessgw/setup.sh 生成, root 0400)。
    volumes:
      - ./secrets:/etc/omnis:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  middleware:
    external: true
    name: config_default
  frontend:
    external: true
    name: wanxiang-frontend_default
  # 主服务 ↔ 访问网关专用网络(无外网出口, 不改变主服务的出口 IP)。网关经它访问内部接口
  # accessgw.internal_listen(:9090), 主服务经它连接网关做开通自检。见 deploy/accessgw/README.md。
  accessgw:
    name: omnis-accessgw-internal
    internal: true
    ipam:
      config:
        - subnet: 172.30.21.0/24
